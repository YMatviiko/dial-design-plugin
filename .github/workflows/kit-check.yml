name: Kit compatibility

# Weekly: run the release check against the newest @epam/ai-dial-ui-kit. A failure means a kit release dropped or
# renamed something the patterns, docs or validator rules rely on; the job opens (or updates) an issue.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # If the kit comes from a private registry, configure it here (e.g. an .npmrc with a token secret).
      - name: Release check against the newest kit
        id: check
        run: node check-release.mjs | tee check.log
        shell: bash -o pipefail {0}
      - name: Open an issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const log = require('fs').readFileSync('check.log', 'utf8').slice(-6000);
            const title = 'Kit compatibility check failed';
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'kit-check' });
            const body = 'The weekly release check failed against the newest kit.\n\n```\n' + log + '\n```';
            if (open.data.length) await github.rest.issues.createComment({ ...context.repo, issue_number: open.data[0].number, body });
            else await github.rest.issues.create({ ...context.repo, title, body, labels: ['kit-check'] });
